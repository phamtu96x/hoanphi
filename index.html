<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Insight - Hoàn Phí Giao Dịch Crypto</title>

    <link rel="icon" type="image/png" href="components/images/logopro.png">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div id="header-placeholder"></div>

    <main>
        <div id="hero-combined-placeholder"></div>

        <section id="san-giao-dich" class="py-5" style="background-color: #f8f9fa;">
            <div class="container" style="width: 50%;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold display-6" style="color: var(--brand-navy);">Sàn Giao Dịch Uy Tín</h2>
                    <p class="text-muted fs-5">Lọc theo nhu cầu giao dịch</p>
                </div>

                <div class="d-flex justify-content-center gap-2 mb-5 flex-wrap">
                    <button class="btn btn-primary rounded-pill px-4 fw-bold filter-btn" onclick="appFilterExchange('all', this)">Tất cả</button>
                    <button class="btn btn-outline-secondary rounded-pill px-4 fw-bold filter-btn" onclick="appFilterExchange('cex', this)">CEX (Crypto)</button>
                    <button class="btn btn-outline-secondary rounded-pill px-4 fw-bold filter-btn" onclick="appFilterExchange('dex', this)">DEX (Web3)</button>
                    <button class="btn btn-outline-secondary rounded-pill px-4 fw-bold filter-btn" onclick="appFilterExchange('forex', this)">Forex</button>
                </div>

                <div class="row g-3" id="exchange-list-container">
                </div>

            </div>
        </section>

        <div id="news-placeholder"></div>


    </main>
    <div id="info-placeholder"></div>
    <div id="footer-placeholder"></div>
    <div id="contact-modal-placeholder"></div>
    <div id="floating-socials-placeholder"></div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>

    <script>
        // Load các thành phần Header/Footer/News từ file ngoài
        loadComponent("header-placeholder", "components/header.html");
        loadComponent("hero-combined-placeholder", "components/hero-combined.html");

        // Lưu ý: Không load "exchanges.html" nữa vì code đã nằm trực tiếp ở trên

        loadComponent("news-placeholder", "components/news.html");

        loadComponent("footer-placeholder", "components/footer.html");
        loadComponent("contact-modal-placeholder", "components/modal-contact.html");
        loadComponent("info-placeholder", "components/info.html");
        loadComponent("floating-socials-placeholder", "components/floating-socials.html");
    </script>
</body>

</html>
